<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Moment Catcher — Have you caught a moment today?</title>
  <meta name="description" content="A quiet place to share the small moments that make life beautiful. Inspired by Mila and the Moment Catcher.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Lora:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="nav.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav id="site-nav"></nav>

  <div class="root">
    <div class="top-section">
      <div class="prompt-text">Have you caught a moment today?</div>
      <div class="sub-prompt">Something small. Something yours.</div>

      <div class="input-bubble">
        <textarea id="momentInput" class="moment-input" rows="3" placeholder="I saw… I felt… I noticed…"></textarea>

        <div id="imagePreviewWrap" style="display:none; margin: 12px 0 0;">
          <img id="imagePreview" style="max-height:160px; border-radius:14px; object-fit:cover; max-width:100%; opacity:0.9;" />
          <button onclick="clearImage()" class="clear-img-btn">✕ remove</button>
        </div>

        <div class="input-footer">
          <label class="upload-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="m21 15-5-5L5 21"/>
            </svg>
            add an image
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)" style="display:none">
          </label>
          <button class="add-btn" onclick="submitMoment()">I see you</button>
        </div>

        <div id="submitStatus" class="submit-status" style="display:none;"></div>
      </div>
    </div>

    <div class="divider">· · ·</div>

    <main class="bubbles-container" id="bubblesContainer">
      <div class="loading-state">gathering moments…</div>
    </main>

    <footer class="quiet-footer">
      What other moments will you catch?<br>Come back and share with us.
    </footer>

    <div class="site-footer">
      <a href="/about.html">About</a>
      <a href="/blog.html">Blog</a>
      <a href="https://www.amazon.com/dp/B0GY5KK8Y3" target="_blank">Get the Book</a>
      <a href="https://www.instagram.com/themomentcatcher_com" target="_blank">Instagram</a>
      <div class="site-footer-copy">© 2026 The Moment Catcher. All rights reserved.</div>
    </div>
  </div>

  <script src="nav.js"></script>
  <script src="app.js"></script>
</body>
</html>
