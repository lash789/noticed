<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Moment Catcher — Have you caught a moment today?</title>
  <meta name="description" content="A quiet place to share the small moments that make life beautiful. Inspired by Mila and the Moment Catcher.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Lora:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="nav.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav id="site-nav"></nav>

  <div class="root">
    <div class="top-section">
      <div class="prompt-text">Have you caught a moment today?</div>
      <div class="sub-prompt">Something small. Something yours.</div>

      <div class="input-bubble">
        <textarea id="momentInput" class="moment-input" rows="3" placeholder="I saw… I felt… I noticed…"></textarea>

        <div id="imagePreviewWrap" style="display:none; margin: 12px 0 0;">
          <img id="imagePreview" style="max-height:160px; border-radius:14px; object-fit:cover; max-width:100%; opacity:0.9;" />
          <button onclick="clearImage()" class="clear-img-btn">✕ remove</button>
        </div>

        <div class="optional-fields">
          <input type="text" id="nameInput" class="optional-input" placeholder="first name (optional)" maxlength="30">
          <input type="text" id="cityInput" class="optional-input" placeholder="city (optional)" maxlength="40">
        </div>

        <div class="input-footer">
          <label class="upload-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="m21 15-5-5L5 21"/>
            </svg>
            add an image
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)" style="display:none">
          </label>
          <button class="add-btn" onclick="submitMoment()">
            <svg class="net-svg-btn" viewBox="0 0 200 130" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <radialGradient id="rimGn" cx="50%" cy="30%" r="70%"><stop offset="0%" stop-color="#F0CC68"/><stop offset="50%" stop-color="#C89030"/><stop offset="100%" stop-color="#8A5C10"/></radialGradient>
                <radialGradient id="fillGn" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.3"/><stop offset="100%" stop-color="#FFD060" stop-opacity="0.02"/></radialGradient>
                <radialGradient id="glowGn" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFF8A0" stop-opacity="0.7"/><stop offset="50%" stop-color="#FFD860" stop-opacity="0.25"/><stop offset="100%" stop-color="#FFA020" stop-opacity="0"/></radialGradient>
                <filter id="fgn" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                <filter id="sfn" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                <clipPath id="netClipN"><ellipse cx="100" cy="58" rx="88" ry="48"/></clipPath>
              </defs>
              <ellipse cx="100" cy="58" rx="88" ry="48" fill="url(#fillGn)"/>
              <g clip-path="url(#netClipN)" stroke="#B89028" stroke-width="0.45" opacity="0.35" fill="none">
                <line x1="18" y1="20" x2="22" y2="106"/><line x1="34" y1="10" x2="38" y2="106"/><line x1="50" y1="10" x2="53" y2="106"/><line x1="66" y1="10" x2="68" y2="106"/><line x1="82" y1="10" x2="83" y2="106"/><line x1="98" y1="10" x2="98" y2="106"/><line x1="114" y1="10" x2="113" y2="106"/><line x1="130" y1="10" x2="128" y2="106"/><line x1="146" y1="10" x2="143" y2="106"/><line x1="162" y1="10" x2="158" y2="106"/><line x1="178" y1="20" x2="174" y2="106"/>
                <path d="M 14 32 Q 100 38 186 32"/><path d="M 12 44 Q 100 50 188 44"/><path d="M 12 56 Q 100 62 188 56"/><path d="M 12 68 Q 100 74 188 68"/><path d="M 14 80 Q 100 86 186 80"/><path d="M 18 92 Q 100 98 182 92"/><path d="M 18 20 Q 100 25 182 20"/>
              </g>
              <ellipse class="net-glow" cx="100" cy="55" rx="52" ry="28" fill="url(#glowGn)"/>
              <ellipse cx="100" cy="58" rx="88" ry="48" stroke="url(#rimGn)" stroke-width="3.5" fill="none"/>
              <ellipse cx="100" cy="58" rx="88" ry="48" stroke="#F8E888" stroke-width="0.8" fill="none" opacity="0.4"/>
              <circle class="net-orb" cx="74" cy="50" r="3" fill="#FFF5A0" filter="url(#fgn)" style="--d:2.4s;--dl:0s"/>
              <circle class="net-orb" cx="104" cy="44" r="2.5" fill="#FFE870" filter="url(#fgn)" style="--d:1.9s;--dl:0.8s"/>
              <circle class="net-orb" cx="130" cy="54" r="2.8" fill="#FFF0A0" filter="url(#fgn)" style="--d:2.7s;--dl:1.3s"/>
              <circle class="net-orb" cx="88" cy="68" r="2.2" fill="#FFE060" filter="url(#fgn)" style="--d:2.1s;--dl:0.5s"/>
              <circle class="net-orb" cx="118" cy="66" r="2.4" fill="#FFF8B0" filter="url(#fgn)" style="--d:3.2s;--dl:1s"/>
              <circle class="net-ff" cx="24" cy="46" r="1.2" fill="#FFD760" filter="url(#sfn)" style="--d:2.2s;--dl:0.3s"/>
              <circle class="net-ff" cx="176" cy="44" r="1.1" fill="#FFE090" filter="url(#sfn)" style="--d:2s;--dl:0.9s"/>
              <circle class="net-ff" cx="100" cy="4" r="1" fill="#FFF5A0" filter="url(#sfn)" style="--d:2.4s;--dl:0.2s"/>
            </svg>
            <span class="net-label">I see you</span>
          </button>
        </div>

        <div id="submitStatus" class="submit-status" style="display:none;"></div>
      </div>
    </div>

    <div class="divider">· · ·</div>
    <h2 class="meadow-heading">The Moment Meadow</h2>

    <main class="bubbles-container" id="bubblesContainer">
      <div class="loading-state">gathering moments…</div>
    </main>

    <footer class="quiet-footer">
      What other moments will you catch?<br>Come back and share with us.
    </footer>

    <div class="site-footer">
      <a href="/about.html">About</a>
      <a href="/blog.html">Blog</a>
      <a href="https://www.amazon.com/dp/B0GY5KK8Y3" target="_blank">Get the Book</a>
      <a href="https://www.instagram.com/themomentcatcher_com" target="_blank">Instagram</a>
      <div class="site-footer-copy">© 2026 The Moment Catcher. All rights reserved.</div>
    </div>
  </div>

  <!-- Submission popup -->
  <div class="moment-popup" id="momentPopup" onclick="closePopup()" style="display:none;">
    <div class="moment-popup-backdrop"></div>
    <div class="moment-popup-card" onclick="event.stopPropagation()">
      <div class="moment-popup-sparkles">
        <div class="popup-sp" style="width:6px;height:6px;top:18%;left:12%;animation-delay:0s"></div>
        <div class="popup-sp" style="width:4px;height:4px;top:14%;left:78%;animation-delay:0.5s"></div>
        <div class="popup-sp" style="width:5px;height:5px;top:72%;left:88%;animation-delay:1s"></div>
        <div class="popup-sp" style="width:3px;height:3px;top:80%;left:18%;animation-delay:0.7s"></div>
        <div class="popup-sp" style="width:4px;height:4px;top:40%;left:5%;animation-delay:1.3s"></div>
        <div class="popup-sp" style="width:5px;height:5px;top:35%;left:93%;animation-delay:0.3s"></div>
      </div>
      <svg class="moment-popup-net" viewBox="0 0 200 130" fill="none">
        <ellipse cx="100" cy="58" rx="88" ry="48" fill="rgba(255,240,180,0.3)"/>
        <g stroke="#C8A030" stroke-width="0.6" opacity="0.4" fill="none">
          <line x1="50" y1="10" x2="53" y2="106"/><line x1="82" y1="10" x2="83" y2="106"/>
          <line x1="114" y1="10" x2="113" y2="106"/><line x1="146" y1="10" x2="143" y2="106"/>
          <path d="M 12 44 Q 100 50 188 44"/><path d="M 12 68 Q 100 74 188 68"/>
        </g>
        <ellipse cx="100" cy="58" rx="88" ry="48" stroke="#D4A030" stroke-width="3" fill="none"/>
        <ellipse cx="100" cy="55" rx="40" ry="22" fill="rgba(255,240,120,0.4)"/>
      </svg>
      <div class="moment-popup-line1" id="popupLine1"></div>
      <div class="moment-popup-line2" id="popupLine2"></div>
      <button class="moment-popup-close" onclick="closePopup()">continue</button>
    </div>
  </div>

  <script src="nav.js"></script>
  <script src="app.js"></script>
</body>
</html>
