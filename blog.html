<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — The Moment Catcher</title>
  <meta name="description" content="Thoughts on mindfulness, presence, and the quiet magic of small moments.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Lora:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="nav.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="blog.css" />
</head>
<body>

  <nav id="site-nav"></nav>

  <div class="blog-root">

    <div class="blog-hero">
      <h1>Small Thoughts</h1>
      <p>On noticing. On slowing down. On being here.</p>
    </div>

    <div class="blog-grid" id="blogGrid">
      <div class="loading-state" style="grid-column:1/-1;padding:60px 0;text-align:center;font-family:'Lora',serif;font-style:italic;color:#b8a080;">gathering thoughts…</div>
    </div>

    <div class="blog-cta">
      <p>Have a moment of your own?</p>
      <a href="/">Share it in the meadow →</a>
    </div>

    <div class="site-footer">
      <a href="/">Home</a>
      <a href="/about.html">About</a>
      <a href="https://www.amazon.com/dp/B0GY5KK8Y3" target="_blank">Get the Book</a>
      <a href="https://www.instagram.com/themomentcatcher_com" target="_blank">Instagram</a>
      <div class="site-footer-copy">© 2026 The Moment Catcher. All rights reserved.</div>
    </div>

  </div>

  <script src="nav.js"></script>
  <script>
    const SPACE  = 'sey3swa85zi6';
    const TOKEN  = 'v0DbJC3PEeEFCpbDtfpcE6GJXF3I7jUuObVfCDXQDxU';
    const BASE   = `https://cdn.contentful.com/spaces/${SPACE}`;

    // ── Simple rich-text renderer ──────────────────────────────
    function renderRichText(doc) {
      if (!doc || !doc.content) return '';
      return doc.content.map(node => renderNode(node)).join('');
    }

    function renderNode(node) {
      const t = node.nodeType;
      const inner = () => (node.content || []).map(renderNode).join('');
      if (t === 'paragraph')            return `<p>${inner()}</p>`;
      if (t === 'heading-1')            return `<h2>${inner()}</h2>`;
      if (t === 'heading-2')            return `<h3>${inner()}</h3>`;
      if (t === 'heading-3')            return `<h4>${inner()}</h4>`;
      if (t === 'unordered-list')       return `<ul>${inner()}</ul>`;
      if (t === 'ordered-list')         return `<ol>${inner()}</ol>`;
      if (t === 'list-item')            return `<li>${inner()}</li>`;
      if (t === 'blockquote')           return `<blockquote>${inner()}</blockquote>`;
      if (t === 'hr')                   return `<hr>`;
      if (t === 'text') {
        let s = node.value || '';
        if (!s) return '';
        (node.marks || []).forEach(m => {
          if (m.type === 'bold')   s = `<strong>${s}</strong>`;
          if (m.type === 'italic') s = `<em>${s}</em>`;
          if (m.type === 'code')   s = `<code>${s}</code>`;
        });
        return s;
      }
      if (t === 'hyperlink') return `<a href="${node.data.uri}" target="_blank" rel="noopener">${inner()}</a>`;
      if (t === 'embedded-asset-block') {
        const id = node.data?.target?.sys?.id;
        return id ? `<img data-asset-id="${id}" class="blog-inline-img" alt="">` : '';
      }
      return inner();
    }

    // ── Fill embedded image URLs after assets are loaded ──────
    function fillAssetImages(assets) {
      document.querySelectorAll('[data-asset-id]').forEach(img => {
        const id = img.getAttribute('data-asset-id');
        const asset = assets.find(a => a.sys.id === id);
        if (asset?.fields?.file?.url) img.src = 'https:' + asset.fields.file.url;
      });
    }

    // ── Format date ───────────────────────────────────────────
    function fmtDate(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    // ── Build a card ──────────────────────────────────────────
    function buildCard(entry, assets, idx) {
      const f = entry.fields;
      const isLarge = idx === 0;

      const imgId = f.coverImage?.sys?.id;
      const asset = imgId ? assets.find(a => a.sys.id === imgId) : null;
      const imgUrl = asset?.fields?.file?.url ? 'https:' + asset.fields.file.url : null;

      const bodyHtml = renderRichText(f.body);
      const date = fmtDate(f.publishedDate || entry.sys.createdAt);

      return `
        <article class="blog-card ${isLarge ? 'blog-card--large' : ''}">
          ${imgUrl ? `<div class="blog-card-img"><img src="${imgUrl}" alt="${f.title || ''}"></div>` : ''}
          <div class="blog-card-date">${date}</div>
          <h2>${f.title || ''}</h2>
          <div class="blog-card-body">${bodyHtml}</div>
          ${f.tag ? `<div class="blog-tag">${f.tag}</div>` : ''}
        </article>`;
    }

    // ── Fetch & render ────────────────────────────────────────
    async function loadBlog() {
      const grid = document.getElementById('blogGrid');
      try {
        const url = `${BASE}/entries?content_type=blogPost&order=-fields.publishedDate&include=2&access_token=${TOKEN}`;
        const res  = await fetch(url);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();

        const posts  = data.items  || [];
        const assets = (data.includes?.Asset) || [];

        if (!posts.length) {
          grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 0;font-family:\'Lora\',serif;font-style:italic;color:#b8a080;">No posts yet — check back soon.</div>';
          return;
        }

        grid.innerHTML = posts.map((p, i) => buildCard(p, assets, i)).join('');
        fillAssetImages(assets);

      } catch (err) {
        console.error('Contentful fetch failed:', err);
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 0;font-family:\'Lora\',serif;font-style:italic;color:#b8a080;">Could not load posts right now.</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadBlog);
  </script>
</body>
</html>
